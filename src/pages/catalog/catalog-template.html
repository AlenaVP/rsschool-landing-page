<main class="main">
  <section id="catalog" class="catalog">
    <div class="wrapper">
      <h1 class="section-title">Behind each of our cups hides an <span class="accent">amazing surprise</span></h1>

      <div class="catalog__tabs" role="tablist" aria-label="Menu categories">
        <button type="button" class="catalog__tab" role="tab" aria-selected="true" data-category="coffee">
          <span class="catalog__tab-icon">
            <img class="catalog__tab-img" src="/img/catalog/icons/coffee.png" alt="" width="32" height="32" />
          </span>
          Coffee
        </button>
        <button type="button" class="catalog__tab" role="tab" aria-selected="false" data-category="tea">
          <span class="catalog__tab-icon">
            <img class="catalog__tab-img" src="/img/catalog/icons/tea.png" alt="" width="32" height="32" />
          </span>
          Tea
        </button>
        <button type="button" class="catalog__tab" role="tab" aria-selected="false" data-category="dessert">
          <span class="catalog__tab-icon">
            <img class="catalog__tab-img" src="/img/catalog/icons/dessert.png" alt="" width="32" height="32" />
          </span>
          Dessert
        </button>
      </div>

      <ul class="catalog__grid" data-catalog-grid></ul>

      <div class="catalog__more">
        <button type="button" class="catalog__more-btn" aria-label="Show more items">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </section>
</main>
