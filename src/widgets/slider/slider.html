<div class="slider" role="region" aria-roledescription="carousel" aria-label="Favorite coffee">
  <div class="slider__row">
    <button type="button" class="slider__btn slider__btn--prev" aria-label="Previous slide">
      <svg class="slider__icon" aria-hidden="true">
        <use href="/svg/sprite.svg#arrow"></use>
      </svg>
    </button>

    <div class="slider__viewport">
      <div class="slider__track"></div>
    </div>

    <button type="button" class="slider__btn slider__btn--next" aria-label="Next slide">
      <svg class="slider__icon" aria-hidden="true">
        <use href="/svg/sprite.svg#arrow"></use>
      </svg>
    </button>
  </div>

  <div class="slider__dots"></div>
</div>
